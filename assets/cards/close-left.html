<!doctype html>
<!-- Editorial left outro. Pair with title-left. -->
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden}
body{background:{{bg}};font-family:'Ubuntu Sans','DejaVu Sans',system-ui,sans-serif;
 display:flex;align-items:stretch}
.rail{flex:0 0 10px;background:linear-gradient(180deg,{{accent1}},{{accent2}} 70%,{{accent3}})}
.wrap{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;
 padding:100px 150px 100px 130px;position:relative}
.kicker{font-size:24px;font-weight:700;color:{{accent1}};margin-bottom:26px;
 opacity:0;animation:slide .7s cubic-bezier(.16,1,.3,1) .08s both}
h1{font-size:84px;line-height:1.14;margin:0;letter-spacing:-.03em;font-weight:800;color:{{ink}};
 max-width:1500px;text-wrap:balance;
 opacity:0;animation:slide .9s cubic-bezier(.16,1,.3,1) .16s both}
.big{font-size:46px;color:{{ink}};line-height:1.5;margin-top:32px;max-width:1360px;
 text-wrap:balance;
 opacity:0;animation:slide .8s cubic-bezier(.16,1,.3,1) .5s both}
.big b{color:{{hi}};font-weight:700}
.big i{color:{{hi2}};font-style:normal}
.links{margin-top:48px;font-size:27px;color:{{muted}};
 border-left:4px solid {{accent1}};padding-left:24px;
 opacity:0;animation:slide .8s cubic-bezier(.16,1,.3,1) .68s both}
.foot{margin-top:14px;font-size:22px;color:{{faint}};padding-left:28px;
 opacity:0;animation:slide .8s cubic-bezier(.16,1,.3,1) .82s both}
@keyframes slide{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
</style></head><body>
<div class="rail"></div>
<div class="wrap">
<div class="kicker">{{name}}</div>
<h1>{{tagline}}</h1>
<div class="big">{{headline}}</div>
<div class="links">{{links}}</div>
<div class="foot">{{footnote}}</div>
</div>
<script>
document.querySelectorAll('h1').forEach(function(el){
  var size = parseFloat(getComputedStyle(el).fontSize);
  while (el.scrollWidth > el.clientWidth && size > 56) {
    size -= 4; el.style.fontSize = size + 'px';
  }
});
</script>
</body></html>
