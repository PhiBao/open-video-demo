<!doctype html>
<!-- Centered product intro. Solid wordmark, one accent, decisive entrance. -->
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden}
body{background:{{bg}};font-family:'Ubuntu Sans','DejaVu Sans',system-ui,sans-serif;
 display:flex;align-items:center;justify-content:center}
.vig{position:fixed;inset:0;pointer-events:none;
 background:radial-gradient(120% 85% at 50% 38%, transparent 58%, {{shade}})}
.stage{position:relative;z-index:2;text-align:center;max-width:1560px;padding:0 80px;
 transform:scale(1.035);animation:settle 1.5s cubic-bezier(.16,1,.3,1) both}
@keyframes settle{from{transform:scale(1.035)}to{transform:scale(1)}}
.rule{width:58px;height:5px;border-radius:3px;background:{{accent1}};margin:0 auto 38px;
 transform:scaleX(0);animation:rule .8s cubic-bezier(.16,1,.3,1) .3s both}
@keyframes rule{to{transform:scaleX(1)}}
.mask{overflow:hidden;padding-bottom:.06em;margin-bottom:-.06em}
h1{font-size:186px;line-height:.96;margin:0;letter-spacing:-.05em;font-weight:800;color:{{ink}};
 white-space:nowrap;transform:translateY(108%);
 animation:rise 1s cubic-bezier(.16,1,.3,1) .16s both}
@keyframes rise{to{transform:translateY(0)}}
.tag{font-size:37px;color:{{subc}};font-weight:600;letter-spacing:-.01em;margin-top:30px;
 opacity:0;animation:up .8s cubic-bezier(.16,1,.3,1) .58s both}
.sub{font-size:27px;color:{{muted}};margin-top:44px;
 opacity:0;animation:up .8s cubic-bezier(.16,1,.3,1) .72s both}
.note{font-size:24px;color:{{faint}};margin-top:14px;
 opacity:0;animation:up .8s cubic-bezier(.16,1,.3,1) .86s both}
.meta{margin-top:60px;display:inline-flex;align-items:center;gap:12px;color:{{muted}};
 font-size:22px;opacity:0;animation:up .8s cubic-bezier(.16,1,.3,1) 1.02s both}
.dot{width:9px;height:9px;border-radius:50%;background:{{accent1}};
 animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
</style></head><body>
<div class="vig"></div>
<div class="stage">
<div class="rule"></div>
<div class="mask"><h1>{{name}}</h1></div>
<div class="tag">{{tagline}}</div>
<div class="sub">{{sub}}</div>
<div class="note">{{note}}</div>
<div class="meta"><span class="dot"></span>{{meta}}</div>
</div>
<script>
document.querySelectorAll('h1').forEach(function(el){
  var size = parseFloat(getComputedStyle(el).fontSize);
  while (el.scrollWidth > el.clientWidth && size > 72) {
    size -= 4; el.style.fontSize = size + 'px';
  }
});
</script>
</body></html>
