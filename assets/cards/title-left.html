<!doctype html>
<!-- Editorial left intro: accent rail, kicker, big wordmark. Pair with close-left. -->
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden}
body{background:{{bg}};font-family:'Ubuntu Sans','DejaVu Sans',system-ui,sans-serif;
 display:flex;align-items:stretch}
.rail{flex:0 0 10px;background:linear-gradient(180deg,{{accent1}},{{accent2}} 70%,{{accent3}})}
.wrap{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;
 padding:100px 150px 100px 130px;position:relative}
.kicker{display:flex;align-items:center;gap:18px;font-size:24px;font-weight:700;
 color:{{accent1}};margin-bottom:38px;
 opacity:0;animation:slide .7s cubic-bezier(.16,1,.3,1) .08s both}
.kicker::before{content:'';width:46px;height:4px;border-radius:2px;background:{{accent1}}}
.mask{overflow:hidden;padding-bottom:.06em;margin-bottom:-.06em}
h1{font-size:158px;line-height:.98;margin:0;letter-spacing:-.045em;font-weight:800;color:{{ink}};
 white-space:nowrap;transform:translateY(108%);
 animation:rise 1s cubic-bezier(.16,1,.3,1) .18s both}
@keyframes rise{to{transform:translateY(0)}}
.tag{font-size:42px;color:{{ink}};font-weight:600;letter-spacing:-.015em;margin-top:28px;
 opacity:0;animation:slide .8s cubic-bezier(.16,1,.3,1) .56s both}
.rule{width:200px;height:5px;border-radius:3px;margin-top:38px;
 background:linear-gradient(90deg,{{accent1}},{{accent2}});
 transform:scaleX(0);transform-origin:0 50%;
 animation:rule .8s cubic-bezier(.16,1,.3,1) .7s both}
@keyframes rule{to{transform:scaleX(1)}}
.sub{font-size:28px;color:{{muted}};margin-top:32px;line-height:1.5;max-width:1240px;
 opacity:0;animation:slide .8s cubic-bezier(.16,1,.3,1) .8s both}
.note{font-size:24px;color:{{faint}};margin-top:12px;
 opacity:0;animation:slide .8s cubic-bezier(.16,1,.3,1) .92s both}
.meta{margin-top:64px;display:inline-flex;align-items:center;gap:12px;color:{{muted}};
 font-size:23px;opacity:0;animation:slide .8s cubic-bezier(.16,1,.3,1) 1.06s both}
.dot{width:9px;height:9px;border-radius:50%;background:{{accent1}};
 animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes slide{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
</style></head><body>
<div class="rail"></div>
<div class="wrap">
<div class="kicker">{{kicker}}</div>
<div class="mask"><h1>{{name}}</h1></div>
<div class="tag">{{tagline}}</div>
<div class="rule"></div>
<div class="sub">{{sub}}</div>
<div class="note">{{note}}</div>
<div class="meta"><span class="dot"></span>{{meta}}</div>
</div>
<script>
document.querySelectorAll('h1').forEach(function(el){
  var size = parseFloat(getComputedStyle(el).fontSize);
  while (el.scrollWidth > el.clientWidth && size > 64) {
    size -= 4; el.style.fontSize = size + 'px';
  }
});
</script>
</body></html>
