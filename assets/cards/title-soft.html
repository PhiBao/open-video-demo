<!doctype html>
<!-- Calm light intro for human-centric products. Pair with close-soft. -->
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden}
body{background:{{bg}};font-family:Georgia,'Times New Roman',serif;
 display:flex;align-items:center;justify-content:center}
.card{background:#FFFEFB;width:1500px;min-height:720px;border-radius:28px;
 padding:84px 100px 76px;position:relative;
 display:flex;flex-direction:column;justify-content:center;
 box-shadow:0 32px 90px rgba(0,0,0,.13);
 animation:rise 1s cubic-bezier(.16,1,.3,1) .1s both}
.pill{position:absolute;top:84px;left:100px;display:inline-flex;align-items:center;gap:10px;
 font-family:'Ubuntu Sans','DejaVu Sans',system-ui,sans-serif;
 font-size:21px;font-weight:700;color:{{accent1}};
 border:1.5px solid {{accent1}};border-radius:999px;padding:10px 26px;
 opacity:0;animation:rise .8s cubic-bezier(.16,1,.3,1) .3s both}
.pill i{width:9px;height:9px;border-radius:50%;background:{{accent1}};font-style:normal}
h1{font-size:134px;margin:0;letter-spacing:-.01em;font-weight:400;line-height:1;color:{{ink}};
 white-space:nowrap;opacity:0;animation:rise .9s cubic-bezier(.16,1,.3,1) .42s both}
.tag{font-family:'Ubuntu Sans','DejaVu Sans',system-ui,sans-serif;
 font-size:38px;color:{{accent1}};margin-top:16px;font-weight:600;letter-spacing:-.01em;
 opacity:0;animation:rise .8s cubic-bezier(.16,1,.3,1) .56s both}
.div{width:110px;height:4px;background:{{accent2}};border-radius:2px;margin-top:34px;
 transform:scaleX(0);transform-origin:0 50%;
 animation:rule .7s cubic-bezier(.16,1,.3,1) .7s both}
@keyframes rule{to{transform:scaleX(1)}}
.sub{font-size:30px;color:{{muted}};margin-top:28px;line-height:1.55;max-width:1250px;
 opacity:0;animation:rise .8s cubic-bezier(.16,1,.3,1) .8s both}
.note{font-family:'Ubuntu Sans','DejaVu Sans',system-ui,sans-serif;
 font-size:23px;color:{{faint}};margin-top:16px;
 opacity:0;animation:rise .8s cubic-bezier(.16,1,.3,1) .94s both}
.meta{position:absolute;left:100px;bottom:58px;
 font-family:'Ubuntu Sans','DejaVu Sans',system-ui,sans-serif;
 font-size:21px;color:{{faint}};
 opacity:0;animation:rise .8s cubic-bezier(.16,1,.3,1) 1.06s both}
.accent{position:absolute;right:100px;bottom:58px;width:170px;height:9px;border-radius:5px;
 background:linear-gradient(90deg,{{accent1}},{{accent2}} 60%,{{accent3}});
 opacity:0;animation:rise .8s cubic-bezier(.16,1,.3,1) 1.06s both}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
</style></head><body>
<div class="card">
<div class="pill"><i></i>{{kicker}}</div>
<h1>{{name}}</h1>
<div class="tag">{{tagline}}</div>
<div class="div"></div>
<div class="sub">{{sub}}</div>
<div class="note">{{note}}</div>
<div class="meta">{{meta}}</div>
<div class="accent"></div>
</div>
<script>
document.querySelectorAll('h1').forEach(function(el){
  var size = parseFloat(getComputedStyle(el).fontSize);
  while (el.scrollWidth > el.clientWidth && size > 64) {
    size -= 4; el.style.fontSize = size + 'px';
  }
});
</script>
</body></html>
